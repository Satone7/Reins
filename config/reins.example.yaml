# Reins Configuration Example (reins.yaml)
# Defines local and remote AI Coding Harness targets, ReinPolicies, caller usage rules, and mobile notification channels.
# Copy to `~/.reins/config.yaml` (or `./config/reins.yaml`) and customize for your environment.
# See protocol specification: docs/H2H_PROTOCOL.md

hub:
  host: 127.0.0.1
  port: 19420
  stateDir: ~/.reins
  loopGuard:
    maxHops: 3
    allowSelfCall: false

# Mobile Push Notification Configuration (Phase 2 & Mobile App Bridge)
notifications:
  enabled: true
  triggers:
    - task.attention_required   # Push immediately on permission prompts or clarification requests
    - task.completed            # Push when a long-running task finishes
    - task.failed               # Push when a task terminates abnormally
  channels:
    - id: mobile-ntfy
      kind: ntfy
      server: https://ntfy.sh
      topic: reins-agent-alerts-example
      priority: high

# Schedulable Local and Remote Harness Targets (Adaptation Order: codex -> antigravity -> dsh -> claudecode)
targets:
  # 1. Local OpenAI Codex (Driven via official `codex app-server --stdio` JSON-RPC 2.0 protocol)
  - id: local-codex
    label: Local OpenAI Codex (app-server)
    harnessType: codex
    transport:
      kind: local
    driver:
      mode: codex-app-server
      command: auto   # Resolves `codex` on PATH or Windows Store Appx `app/resources/codex.exe`
      args: ["app-server", "--stdio"]
    # Optional target-level model and reasoning effort defaults (falls back to ~/.codex/config.toml if omitted)
    # Query available choices dynamically via: `reins models local-codex`
    # model: gpt-6.1-sol
    # effort: high    # low | medium | high | xhigh | max | ultra
    workspace:
      defaultWorkdir: .
      allowedSyncModes: [remote-native, context-only]
    reinPolicy: auto-edit
    tags: [coding, review, adversarial-review, rescue]

  # 2. Local Antigravity (AGY)
  - id: local-agy
    label: Local Antigravity (AGY)
    harnessType: antigravity
    transport:
      kind: local
    driver:
      mode: agentapi
      command: auto
      args: []
    model: flash_lite
    workspace:
      defaultWorkdir: .
      allowedSyncModes: [remote-native, context-only]
    reinPolicy: parent-rein
    tags: [coding, planning, orchestration]

  # 3. Local DeepSeek Harness (Driven via ACP or DSH SDK protocol)
  - id: local-dsh
    label: Local DeepSeek Harness (ACP)
    harnessType: dsh
    transport:
      kind: local
    driver:
      mode: acp
      command: npx
      args: ["@deepseek-ai/dsh", "--profile", "acp"]
    model: deepseek-flash
    workspace:
      defaultWorkdir: .
      allowedSyncModes: [remote-native, context-only]
    reinPolicy: parent-rein
    tags: [coding, automation, plugin-dev]

  # 4. Remote Linux Node DeepSeek Harness (headless JSONL over SSH)
  - id: remote-dsh
    label: Remote Linux DeepSeek Harness
    harnessType: dsh
    transport:
      kind: ssh
      sshHost: dev-node.example.com
      connectTimeoutSec: 20
    driver:
      mode: dsh-headless
      command: /usr/local/bin/dsh
      args: []
    model: deepseek-flash
    workspace:
      defaultWorkdir: /workspace/project
      allowedSyncModes: [remote-native, context-only]
    reinPolicy: auto-edit
    tags: [coding, linux-shell]

  # 5. Remote Linux Node Claude Code (Interactive Tmux + JSONL Driver with Caller Usage Rules)
  - id: remote-claude
    label: Remote Linux Claude Code (SSH + Tmux)
    harnessType: claude-code
    transport:
      kind: ssh
      sshHost: dev-node.example.com
      connectTimeoutSec: 20
    driver:
      mode: claude-tmux
      binaryPath: /usr/local/bin/claude
      tmuxPrefix: reins-cc
      paneCols: 140
      paneRows: 45
      extraArgs: []
    workspace:
      defaultWorkdir: /workspace/project
      allowedSyncModes: [remote-native, git-patch, context-only]
    reinPolicy: tight-rein
    tags: [coding, architecture, code-review]
    rules: |
      1. Language & Documentation: Write all prompts and generated documentation in clear English.
      2. Timezone Convention: Express all timestamps and log references in UTC or America/Los_Angeles.
      3. Workspace Discipline: Run tests before concluding a coding turn and summarize changed files.
