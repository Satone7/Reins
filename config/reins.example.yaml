# Reins Configuration Example (reins.yaml)
# Defines local and remote AI Coding Harness targets, ReinPolicies, and mobile notification channels.
# See protocol specification: docs/H2H_PROTOCOL.md (v0.2)

hub:
  host: 127.0.0.1
  port: 19420
  stateDir: ~/.reins
  loopGuard:
    maxHops: 3
    allowSelfCall: false

# Mobile Push Notification Configuration (Phase 2 & Mobile App Bridge)
notifications:
  enabled: true
  triggers:
    - task.attention_required   # Push immediately on permission prompts or clarification requests
    - task.completed            # Push when a long-running task finishes
    - task.failed               # Push when a task terminates abnormally
  channels:
    - id: mobile-ntfy
      kind: ntfy
      server: https://ntfy.sh
      topic: reins-agent-alerts-example
      priority: high

# Schedulable Local and Remote Harness Targets (Adaptation Order: codex -> antigravity -> dsh -> claudecode)
targets:
  # 1. Local OpenAI Codex (Driven via official `codex app-server --stdio` JSON-RPC 2.0 protocol)
  - id: local-codex
    label: Local OpenAI Codex (app-server)
    harnessType: codex
    transport:
      kind: local
    driver:
      mode: codex-app-server
      command: auto   # Resolves `codex` on PATH or Windows Store Appx `app/resources/codex.exe`
      args: ["app-server", "--stdio"]
    workspace:
      defaultWorkdir: C:/Users/ariab/Desktop/workspace/reins
      allowedSyncModes: [remote-native, context-only]
    reinPolicy: auto-edit
    tags: [coding, review, adversarial-review, rescue]

  # 2. Local Antigravity (AGY)
  - id: local-agy
    label: Local Antigravity (AGY)
    harnessType: antigravity
    transport:
      kind: local
    driver:
      mode: agentapi
      command: auto
      args: []
    model: flash_lite
    workspace:
      defaultWorkdir: C:/Users/ariab/Desktop/workspace/reins
      allowedSyncModes: [remote-native, context-only]
    reinPolicy: parent-rein
    tags: [coding, planning, orchestration]

  # 3. Local DeepSeek Harness (Driven via ACP or DSH SDK protocol)
  - id: local-dsh
    label: Local DeepSeek Harness (ACP)
    harnessType: dsh
    transport:
      kind: local
    driver:
      mode: acp
      command: npx
      args: ["@deepseek-ai/dsh", "--profile", "acp"]
    workspace:
      defaultWorkdir: C:/Users/ariab/Desktop/workspace/reins
      allowedSyncModes: [remote-native, context-only]
    reinPolicy: parent-rein
    tags: [coding, automation, plugin-dev]

  # 4. LAN Remote Ubuntu Node (faex1) DeepSeek Harness (headless JSONL)
  - id: faex1-dsh
    label: FAEX1 Remote DeepSeek Harness
    harnessType: dsh
    transport:
      kind: ssh
      sshHost: faex1
      connectTimeoutSec: 20
    driver:
      mode: dsh-headless
      command: /home/pren/n/bin/dsh
      args: []
    env:
      PATH: /home/pren/n/bin:/usr/local/bin:/usr/bin:/bin
      NARB_DISABLE_NATIVE_CACHE: "1"
    workspace:
      defaultWorkdir: /home/pren/projects/reins
      allowedSyncModes: [remote-native, context-only]
    reinPolicy: auto-edit
    tags: [coding, linux-shell]

  # 5. LAN Remote Ubuntu Node (faex1) Claude Code (Interactive Tmux + JSONL Driver)
  - id: faex1-claude
    label: FAEX1 Remote Claude Code
    harnessType: claude-code
    transport:
      kind: ssh
      sshHost: faex1
      connectTimeoutSec: 20
    driver:
      mode: claude-tmux
      binaryPath: /home/pren/n/bin/claude
      tmuxPrefix: reins-cc
      paneCols: 140
      paneRows: 45
      extraArgs: []
    env:
      PATH: /home/pren/n/bin:/usr/local/bin:/usr/bin:/bin
    workspace:
      defaultWorkdir: /home/pren/projects/reins
      allowedSyncModes: [remote-native, git-patch, context-only]
    reinPolicy: tight-rein
    tags: [coding, refactoring, linux-shell, debugging]

  # 6. Cloud Production VPS Claude Code (Connected via ProxyJump)
  - id: vps-claude
    label: Cloud VPS Claude Code
    harnessType: claude-code
    transport:
      kind: ssh
      sshHost: claude-vps
      connectTimeoutSec: 20
    driver:
      mode: claude-tmux
      binaryPath: /home/frank/.local/bin/claude
      tmuxPrefix: reins-cc
      paneCols: 140
      paneRows: 45
      extraArgs: []
    workspace:
      defaultWorkdir: /home/frank/workspace
      allowedSyncModes: [remote-native, git-patch, context-only]
    reinPolicy: tight-rein
    tags: [coding, architecture, code-review]
